name: Update quiz catalog
on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.json'
      - 'scripts/build_catalog.py'
      - '!data/catalog.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_catalog.py
      - name: Commit generated catalog
        run: |
          if ! git diff --quiet -- data/catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/catalog.json
            git commit -m 'Auto-update quiz catalog'
            git push
          fi
